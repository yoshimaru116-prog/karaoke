<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アイテムルーレット</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
}

.box{
    margin:40px auto;
    padding:20px;
    border:1px solid #ccc;
    width:300px;
}
</style>
</head>

<body>

<!-- 藤 -->
<div class="box">

<h1>アイテムルーレット（藤）</h1>

<p id="word1"></p>

<button onclick="generateRandomWord1()">
まわす
</button>

<button onclick="excludeWord1()">
今後表示しない
</button>

<button onclick="goBack1()">
一つ前に戻る
</button>

<button onclick="resetExcludedWords1()">
保存リセット
</button>

</div>

<!-- 茶 -->
<div class="box">

<h1>アイテムルーレット（茶）</h1>

<p id="word2"></p>

<button onclick="generateRandomWord2()">
まわす
</button>

<button onclick="excludeWord2()">
今後表示しない
</button>

<button onclick="goBack2()">
一つ前に戻る
</button>

<button onclick="resetExcludedWords2()">
保存リセット
</button>

</div>

<script>

/* ===== 藤 ===== */

const words1 = [
"ビンゴ",
"四捨五入",
"レベル指定",
"１時間＋１",
"１時間－１"
];

let currentWord1 = "";
let previousWord1 = "";

const excludedWords1 =
    new Set(
        JSON.parse(
            localStorage.getItem("excludedWords1")
        ) || []
    );

function saveExcludedWords1(){

    localStorage.setItem(
        "excludedWords1",
        JSON.stringify([...excludedWords1])
    );
}

function getRandomWord1(){

    const availableWords =
        words1.filter(
            word => !excludedWords1.has(word)
        );

    if(availableWords.length === 0){

        return "項目がありません";

    }

    const randomIndex =
        Math.floor(
            Math.random() * availableWords.length
        );

    return availableWords[randomIndex];
}

function generateRandomWord1(){

    previousWord1 = currentWord1;

    currentWord1 = getRandomWord1();

    document.getElementById("word1").textContent =
        currentWord1;
}

function excludeWord1(){

    if(currentWord1 === "") return;

    excludedWords1.add(currentWord1);

    saveExcludedWords1();

    generateRandomWord1();
}

function goBack1(){

    if(previousWord1 !== ""){

        excludedWords1.delete(previousWord1);

        saveExcludedWords1();

        currentWord1 = previousWord1;

        document.getElementById("word1").textContent =
            currentWord1;
    }
}

function resetExcludedWords1(){

    excludedWords1.clear();

    localStorage.removeItem("excludedWords1");

    generateRandomWord1();
}

/* ===== 茶 ===== */

const words2 = [
"自分引き直し禁止",
"相手引き直し禁止",
"３曲音程バー無し",
"ユニ指定",
"点数当て＋２全ミス－５"
];

let currentWord2 = "";
let previousWord2 = "";

const excludedWords2 =
    new Set(
        JSON.parse(
            localStorage.getItem("excludedWords2")
        ) || []
    );

function saveExcludedWords2(){

    localStorage.setItem(
        "excludedWords2",
        JSON.stringify([...excludedWords2])
    );
}

function getRandomWord2(){

    const availableWords =
        words2.filter(
            word => !excludedWords2.has(word)
        );

    if(availableWords.length === 0){

        return "項目がありません";

    }

    const randomIndex =
        Math.floor(
            Math.random() * availableWords.length
        );

    return availableWords[randomIndex];
}

function generateRandomWord2(){

    previousWord2 = currentWord2;

    currentWord2 = getRandomWord2();

    document.getElementById("word2").textContent =
        currentWord2;
}

function excludeWord2(){

    if(currentWord2 === "") return;

    excludedWords2.add(currentWord2);

    saveExcludedWords2();

    generateRandomWord2();
}

function goBack2(){

    if(previousWord2 !== ""){

        excludedWords2.delete(previousWord2);

        saveExcludedWords2();

        currentWord2 = previousWord2;

        document.getElementById("word2").textContent =
            currentWord2;
    }
}

function resetExcludedWords2(){

    excludedWords2.clear();

    localStorage.removeItem("excludedWords2");

    generateRandomWord2();
}

/* 初期表示 */
generateRandomWord1();
generateRandomWord2();

</script>

</body>
</html>
