<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>アイテムルーレット</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.box{
    background:white;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    max-width:380px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.result{
    font-size:30px;
    font-weight:bold;
    margin:30px 0;
    min-height:50px;
    transition:0.2s;
}

.spinning{
    animation:flash 0.1s infinite;
}

@keyframes flash{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
}

button{
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.spin{
    background:#4CAF50;
    color:white;
}

.exclude{
    background:#f44336;
    color:white;
}

.back{
    background:#2196F3;
    color:white;
}

.reset{
    background:#777;
    color:white;
}

.history{
    margin-top:20px;
    text-align:left;
}

.history h3{
    margin-bottom:10px;
}

.history-list{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    max-height:200px;
    overflow-y:auto;
}

.history-item{
    padding:5px 0;
    border-bottom:1px solid #eee;
}

</style>
</head>

<body>

<div id="roulette1" class="box"></div>

<div id="roulette2" class="box"></div>

<script>

const items = [
    "ビンゴ",
    "四捨五入",
    "レベル指定",
    "１時間＋１",
    "１時間－１",
    "自分引き直し禁止",
    "相手引き直し禁止",
    "３曲音程バー無し",
    "ユニ指定",
    "点数当て＋２全ミス－５"
];

function createRoulette(id, title){

    const container =
        document.getElementById(id);

    container.innerHTML = `
        <h1>${title}</h1>

        <div class="result"
            id="${id}-result">
        </div>

        <div class="buttons">

            <button class="spin"
                onclick="${id}.spin()">
                まわす
            </button>

            <button class="exclude"
                onclick="${id}.exclude()">
                今後表示しない
            </button>

            <button class="back"
                onclick="${id}.back()">
                一つ前に戻る
            </button>

            <button class="reset"
                onclick="${id}.reset()">
                保存リセット
            </button>

        </div>

        <div class="history">

            <h3>履歴</h3>

            <div class="history-list"
                id="${id}-history">
            </div>

        </div>
    `;

    let current = "";
    let previous = "";

    const excluded =
        new Set(
            JSON.parse(
                localStorage.getItem(id + "-excluded")
            ) || []
        );

    let history =
        JSON.parse(
            localStorage.getItem(id + "-history")
        ) || [];

    function save(){

        localStorage.setItem(
            id + "-excluded",
            JSON.stringify([...excluded])
        );

        localStorage.setItem(
            id + "-history",
            JSON.stringify(history)
        );
    }

    function getRandom(){

        const available =
            items.filter(
                item => !excluded.has(item)
            );

        if(available.length === 0){
            return "項目がありません";
        }

        return available[
            Math.floor(
                Math.random() * available.length
            )
        ];
    }

    function update(text){

        document.getElementById(
            `${id}-result`
        ).textContent = text;
    }

    function updateHistory(){

        const historyDiv =
            document.getElementById(
                `${id}-history`
            );

        historyDiv.innerHTML = "";

        [...history]
        .reverse()
        .forEach(item => {

            const div =
                document.createElement("div");

            div.className = "history-item";

            div.textContent = item;

            historyDiv.appendChild(div);

        });
    }

    updateHistory();

    return {

        spin(){

            const resultDiv =
                document.getElementById(
                    `${id}-result`
                );

            resultDiv.classList.add("spinning");

            let count = 0;

            const interval =
                setInterval(() => {

                    update(
                        items[
                            Math.floor(
                                Math.random()
                                * items.length
                            )
                        ]
                    );

                    count++;

                    if(count >= 15){

                        clearInterval(interval);

                        resultDiv.classList.remove(
                            "spinning"
                        );

                        previous = current;

                        current = getRandom();

                        update(current);

                        history.push(current);

                        if(history.length > 20){
                            history.shift();
                        }

                        save();

                        updateHistory();
                    }

                }, 80);
        },

        exclude(){

            if(current === "") return;

            excluded.add(current);

            save();

            this.spin();
        },

        back(){

            if(previous === "") return;

            current = previous;

            update(current);
        },

        reset(){

            excluded.clear();

            history = [];

            localStorage.removeItem(
                id + "-excluded"
            );

            localStorage.removeItem(
                id + "-history"
            );

            updateHistory();

            this.spin();
        }
    };
}

const roulette1 =
    createRoulette(
        "roulette1",
        "アイテムルーレット（藤）"
    );

const roulette2 =
    createRoulette(
        "roulette2",
        "アイテムルーレット（茶）"
    );

roulette1.spin();
roulette2.spin();

</script>

</body>
</html>
