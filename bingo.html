<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ビンゴ</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:20px;
}

textarea{
    width:320px;
    height:100px;
    font-size:16px;
}

.grid{
    width:330px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.cell{
    width:100px;
    height:100px;
    background:white;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    border:3px solid #ccc;
    user-select:none;
}

/* タップ */
.open{
    background:#81c784 !important;
    color:white !important;
}

/* 中央 */
.center{
    background:white;
    color:black;
}

/* 中央＋タップ */
.center.open{
    background:#81c784 !important;
    color:white !important;
}

/* ビンゴ */
.bingo{
    background:#ff5252 !important;
    color:white !important;
}

/* ★中央もビンゴで赤優先 */
.center.open.bingo{
    background:#ff5252 !important;
    color:white !important;
}

button{
    padding:12px 20px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}

#bingoText{
    font-size:24px;
    font-weight:bold;
    color:red;
    margin-top:10px;
}

#bingoCount{
    font-size:20px;
    color:#1976d2;
}

</style>
</head>

<body>

<h1>ビンゴ</h1>

<textarea id="input">
85
86
87
88
89
</textarea>

<br>

<label>
<input type="checkbox" id="centerToggle">
中央固定
</label>

<input type="text" id="centerValue" value="90">

<br>

<button onclick="generate()">スタート</button>
<button onclick="resetGame()">リセット</button>

<div id="bingoText"></div>
<div id="bingoCount"></div>

<div class="grid" id="grid"></div>

<script>

const grid = document.getElementById("grid");

let open = [];
let board = [];

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

/* ======================
   💾 保存
====================== */
function saveGame(){
    localStorage.setItem("bingoSave", JSON.stringify({
        board,
        open,
        input: document.getElementById("input").value,
        centerMode: document.getElementById("centerToggle").checked,
        centerValue: document.getElementById("centerValue").value
    }));
}

/* ======================
   🔁 復元
====================== */
function loadGame(){

    const saved = localStorage.getItem("bingoSave");
    if(!saved) return;

    const data = JSON.parse(saved);

    document.getElementById("input").value = data.input || "";
    document.getElementById("centerToggle").checked = data.centerMode || false;
    document.getElementById("centerValue").value = data.centerValue || "";

    board = data.board || [];
    open = data.open || [];

    if(board.length){
        render();
    }
}

/* ======================
   🎨 描画
====================== */
function render(){

    grid.innerHTML = "";

    const centerMode = document.getElementById("centerToggle").checked;

    board.forEach((v,i)=>{

        const cell = document.createElement("div");
        cell.className = "cell";

        if(centerMode && i===4){
            cell.classList.add("center");
        }

        if(open.includes(i)){
            cell.classList.add("open");
        }

        cell.textContent = v;

        cell.addEventListener("click",()=>{

            if(open.includes(i)){
                open = open.filter(x=>x!==i);
            }else{
                open.push(i);
            }

            saveGame();
            check();
            render();
        });

        grid.appendChild(cell);
    });

    check();
}

/* ======================
   🎰 スロット生成
====================== */
function generate(){

    let items = document.getElementById("input").value
    .split("\n")
    .map(v=>v.trim())
    .filter(v=>v!=="");

    const centerMode = document.getElementById("centerToggle").checked;
    const centerValue = document.getElementById("centerValue").value;

    let pool = [];
    for(let i=0;i<40;i++) pool = pool.concat(items);

    items = shuffle(items);

    const selected = centerMode
    ? items.concat(items).slice(0,8)
    : items.concat(items).slice(0,9);

    board = centerMode ?
    [
        selected[0],selected[1],selected[2],
        selected[3],centerValue,selected[4],
        selected[5],selected[6],selected[7]
    ]
    : selected;

    open = [];

    grid.innerHTML = "";
    document.getElementById("bingoText").textContent = "";
    document.getElementById("bingoCount").textContent = "";

    board.forEach((v,i)=>{

        const cell = document.createElement("div");
        cell.className = "cell";

        if(centerMode && i===4){
            cell.classList.add("center");
        }

        grid.appendChild(cell);

        let count = 0;

        const interval = setInterval(()=>{

            if(centerMode && i===4){
                cell.textContent = centerValue;
                return;
            }

            cell.textContent =
            pool[Math.floor(Math.random()*pool.length)];

            count++;

            if(count > 30 + i*3){
                clearInterval(interval);
                cell.textContent = v;
            }

        },60);

        cell.addEventListener("click",()=>{

            if(open.includes(i)){
                open = open.filter(x=>x!==i);
            }else{
                open.push(i);
            }

            saveGame();
            check();
            render();
        });

    });

    saveGame();
    check();
}

/* ======================
   🟩 ビンゴ判定（中央もOK）
====================== */
function check(){

    const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    const cells = document.querySelectorAll(".cell");

    cells.forEach(c=>{
        c.classList.remove("bingo");
    });

    let bingo = 0;

    lines.forEach(line=>{

        if(line.every(i=>open.includes(i))){
            bingo++;

            line.forEach(i=>{
                const cell = cells[i];
                cell.classList.add("bingo");
                cell.classList.add("open");
            });
        }
    });

    document.getElementById("bingoText")
    .textContent = bingo ? "BINGO！" : "";

    document.getElementById("bingoCount")
    .textContent = "ビンゴ数：" + bingo;

    saveGame();
}

/* ======================
   🔴 リセット
====================== */
function resetGame(){

    localStorage.removeItem("bingoSave");

    open = [];
    board = [];

    grid.innerHTML = "";

    document.getElementById("bingoText").textContent = "";
    document.getElementById("bingoCount").textContent = "";
}

/* 起動 */
loadGame();

</script>

</body>
</html>
