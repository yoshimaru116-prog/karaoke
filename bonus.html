<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ボーナスルーレット</title>

<style>
body {
  text-align: center;
  font-family: sans-serif;
  background: #111;
  color: #fff;
}

.container {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 30px;
}

.slot {
  width: 180px;
  height: 80px;
  border: 4px solid #fff;
  overflow: hidden;
  background: #000;
  position: relative;
}

.reel {
  position: absolute;
  width: 100%;
  top: 0;
}

.item {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  padding: 0;
}

textarea {
  width: 160px;
  height: 120px;
}

button {
  margin: 10px;
  padding: 10px 20px;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
}

#history {
  margin-top: 10px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}

.history-item {
  background: #222;
  padding: 8px;
  margin: 4px 0;
  border-radius: 6px;
  font-size: 14px;
}

#status {
  margin-top: 10px;
  font-size: 12px;
  color: #888;
}

@media (max-width: 600px) {
  .slot {
    width: 100px;
    height: 60px;
  }

  .item {
    height: 60px;
    font-size: 14px;
  }

  button {
    width: 80%;
    max-width: 300px;
    font-size: 16px;
    padding: 12px;
  }

  textarea {
    width: 90%;
    height: 80px;
  }
}
</style>
</head>

<body>

<h1>ボーナスルーレット</h1>
<div id="status">Firebase に接続中...</div>

<div class="container">
  <div class="slot"><div class="reel" id="reel1"></div></div>
  <div class="slot"><div class="reel" id="reel2"></div></div>
  <div class="slot"><div class="reel" id="reel3"></div></div>
</div>

<button onclick="spin()">スタート</button>
<div id="result">結果：---</div>

<h2>履歴</h2>
<div id="history"></div>
<button onclick="clearHistory()">履歴クリア</button>

<div style="margin-top:40px;">
  <p>リール1</p>
  <textarea id="input1"></textarea>

  <p>リール2</p>
  <textarea id="input2"></textarea>

  <p>リール3</p>
  <textarea id="input3"></textarea><br>

  <button onclick="saveItems()">保存</button>
  <button onclick="clearItems()">リセット</button>
</div>

<!-- Firebase SDK (モジュラー版 CDN) -->
<script type="module">
import { initializeApp } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js)";
import { getDatabase, ref, set, get, push, remove, onValue } from "[gstatic.com](https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js)";

// Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyCvjizg21d4M6PjkKJgEzWAy6hmyHLR8j0",
  authDomain: "proseka-roulette.firebaseapp.com",
  databaseURL: "[proseka-roulette-default-rtdb.firebaseio.com](https://proseka-roulette-default-rtdb.firebaseio.com)",
  projectId: "proseka-roulette",
  storageBucket: "proseka-roulette.firebasestorage.app",
  messagingSenderId: "595448425100",
  appId: "1:595448425100:web:3db43056c3c879f73c69a9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// DOM 要素
const reels = [
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
];
const statusEl = document.getElementById("status");

let itemsList = [];
let ITEM_HEIGHT = 80;
const stopTimes = [1000, 3000, 5000];
let spinning = false;

// ===== リール関連 =====
function getItems(id) {
  return document.getElementById(id).value
    .split("\n")
    .filter(t => t.trim() !== "");
}

function updateItems() {
  itemsList = [
    getItems("input1"),
    getItems("input2"),
    getItems("input3")
  ];

  reels.forEach((reel, i) => createReel(reel, itemsList[i]));

  setTimeout(() => {
    const el = document.querySelector(".item");
    if (el) ITEM_HEIGHT = el.offsetHeight;
  }, 0);
}

function createReel(reel, items) {
  reel.innerHTML = "";
  if (items.length === 0) return;

  for (let i = 0; i < 60; i++) {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = items[i % items.length];
    reel.appendChild(div);
  }
}

// ===== Firebase 保存・読み込み =====
async function saveItems() {
  const data = {
    reel1: document.getElementById("input1").value,
    reel2: document.getElementById("input2").value,
    reel3: document.getElementById("input3").value
  };

  try {
    await set(ref(db, "slotData"), data);
    alert("保存しました");
    updateItems();
  } catch (e) {
    alert("保存に失敗しました: " + e.message);
  }
}

async function loadItems() {
  try {
    const snapshot = await get(ref(db, "slotData"));
    if (snapshot.exists()) {
      const data = snapshot.val();
      document.getElementById("input1").value = data.reel1 || "";
      document.getElementById("input2").value = data.reel2 || "";
      document.getElementById("input3").value = data.reel3 || "";
    }
    updateItems();
    statusEl.textContent = "Firebase 接続済み ✓";
    statusEl.style.color = "#4f4";
  } catch (e) {
    statusEl.textContent = "接続エラー: " + e.message;
    statusEl.style.color = "#f44";
  }
}

async function clearItems() {
  try {
    await remove(ref(db, "slotData"));
    document.getElementById("input1").value = "";
    document.getElementById("input2").value = "";
    document.getElementById("input3").value = "";
    updateItems();
  } catch (e) {
    alert("リセットに失敗しました: " + e.message);
  }
}

// ===== 履歴 (Firebase) =====
function renderHistory(history) {
  const el = document.getElementById("history");
  el.innerHTML = history.map(item =>
    `<div class="history-item">${item}</div>`
  ).join("");
}

// リアルタイムで履歴を監視
onValue(ref(db, "history"), (snapshot) => {
  if (snapshot.exists()) {
    const data = snapshot.val();
    // オブジェクトを配列に変換し、新しい順に並べる
    const history = Object.entries(data)
      .sort((a, b) => b[1].timestamp - a[1].timestamp)
      .map(([, v]) => v.text)
      .slice(0, 20);
    renderHistory(history);
  } else {
    renderHistory([]);
  }
});

async function addHistory(text) {
  try {
    await push(ref(db, "history"), {
      text: text,
      timestamp: Date.now()
    });
  } catch (e) {
    console.error("履歴の追加に失敗:", e);
  }
}

async function clearHistory() {
  try {
    await remove(ref(db, "history"));
  } catch (e) {
    alert("履歴のクリアに失敗しました: " + e.message);
  }
}

// ===== スピン =====
function spin() {
  if (spinning) return;
  if (itemsList.some(arr => arr.length === 0)) {
    alert("項目を入力してください");
    return;
  }

  spinning = true;
  const results = [];

  reels.forEach((reel, index) => {
    const items = itemsList[index];
    let position = 0;
    let speed = 40;

    const stopIndex = Math.floor(Math.random() * items.length);
    results.push(items[stopIndex]);

    const interval = setInterval(() => {
      position += speed;
      if (position >= items.length * ITEM_HEIGHT) position = 0;
      reel.style.transform = `translateY(-${position}px)`;
    }, 16);

    setTimeout(() => {
      const decelerate = setInterval(() => {
        if (index === 0) speed *= 0.9;
        else if (index === 1) speed *= 0.95;
        else speed *= 0.97;

        if (speed < 2) {
          clearInterval(decelerate);
          clearInterval(interval);

          reel.style.transform = `translateY(-${stopIndex * ITEM_HEIGHT}px)`;

          if (index === 2) {
            setTimeout(() => {
              const resultText = results.join(" / ");
              document.getElementById("result").textContent = "結果：" + resultText;
              addHistory(resultText);
              spinning = false;
            }, 300);
          }
        }
      }, 50);
    }, stopTimes[index]);
  });
}

// グローバルに公開（onclick から呼べるように）
window.spin = spin;
window.saveItems = saveItems;
window.clearItems = clearItems;
window.clearHistory = clearHistory;

// 起動時にデータ読み込み
loadItems();
</script>

</body>
</html>
