<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ユニットルーレット</title>

<style>

body{
    font-family: sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 20px;
    touch-action: manipulation;
}

h1{
    margin-bottom: 30px;
}

.roulette-area{
    background: white;
    padding: 20px;
    margin-bottom: 30px;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.result-box{
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.word{
    width: 140px;
    height: 140px;
    background: #f0f0f0;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    transition: 0.2s;
}

.flash{
    box-shadow: 0 0 15px gold;
    transform: scale(1.05);
}

button{
    margin: 5px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

.history{
    margin-top: 15px;
}

.history ul{
    list-style: none;
    padding: 0;
}

</style>

</head>

<body>

<h1>ユニットルーレット</h1>

<!-- 1個目 -->
<div class="roulette-area">

    <h2>ユニット（藤）</h2>

    <div class="result-box">
        <div id="word1a" class="word">?</div>
        <div id="word1b" class="word">?</div>
    </div>

    <button onclick="spin1()">まわす</button>
    <button onclick="clearHistory1()">履歴リセット</button>

    <div class="history">
        <h3>履歴</h3>
        <ul id="history1"></ul>
    </div>

</div>

<!-- 2個目 -->
<div class="roulette-area">

    <h2>ユニット（茶）</h2>

    <div class="result-box">
        <div id="word2a" class="word">?</div>
        <div id="word2b" class="word">?</div>
    </div>

    <button onclick="spin2()">まわす</button>
    <button onclick="clearHistory2()">履歴リセット</button>

    <div class="history">
        <h3>履歴</h3>
        <ul id="history2"></ul>
    </div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ======================
   Firebase設定
====================== */

const firebaseConfig = {

   apiKey: "AIzaSyCvjizg21d4M6PjkKJgEzWAy6hmyHLR8j0",
   authDomain: "proseka-roulette.firebaseapp.com",
   databaseURL: "https://proseka-roulette-default-rtdb.firebaseio.com",
   projectId: "proseka-roulette",
   storageBucket: "proseka-roulette.firebasestorage.app",
   messagingSenderId: "595448425100",
   appId: "1:595448425100:web:3db43056c3c879f73c69a9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ======================
   Firebase参照
====================== */

const history1Ref = ref(db, "unitroulette/history1");
const history2Ref = ref(db, "unitroulette/history2");

/* ======================
   スロット演出
====================== */

function slotEffect(el, finalValue, pool, duration = 1200){

    let start = Date.now();

    let timer = setInterval(()=>{

        el.textContent =
        pool[Math.floor(Math.random() * pool.length)];

        if(Date.now() - start > duration){

            clearInterval(timer);

            el.textContent = finalValue;

            el.classList.add("flash");

            setTimeout(()=>{
                el.classList.remove("flash");
            }, 300);
        }

    }, 60);
}

/* ======================
   履歴
====================== */

let history1 = [];
let history2 = [];

/* ======================
   Firebase同期
====================== */

onValue(history1Ref, (snapshot)=>{

    history1 = snapshot.val() || [];

    displayHistory1();
});

onValue(history2Ref, (snapshot)=>{

    history2 = snapshot.val() || [];

    displayHistory2();
});

/* ======================
   データ
====================== */

const words = [
    "バチャシン",
    "モアジャン",
    "レオ二",
    "ビビバス",
    "ワンダショ",
    "ニーゴ"
];

/* ======================
   ランダム2つ
====================== */

function getRandomPair(array){

    let a = Math.floor(Math.random() * array.length);
    let b;

    do{
        b = Math.floor(Math.random() * array.length);
    }while(a === b);

    return [array[a], array[b]];
}

/* ======================
   1つ目
====================== */

window.spin1 = function(){

    const result = getRandomPair(words);

    slotEffect(document.getElementById("word1a"), result[0], words);
    slotEffect(document.getElementById("word1b"), result[1], words);

    history1.unshift(result[0] + " ＆ " + result[1]);

    set(history1Ref, history1);
}

function displayHistory1(){

    const ul = document.getElementById("history1");

    ul.innerHTML = "";

    history1.forEach(item=>{

        const li = document.createElement("li");

        li.textContent = item;

        ul.appendChild(li);
    });
}

window.clearHistory1 = function(){

    history1 = [];

    set(history1Ref, []);
}

/* ======================
   2つ目
====================== */

window.spin2 = function(){

    const result = getRandomPair(words);

    slotEffect(document.getElementById("word2a"), result[0], words);
    slotEffect(document.getElementById("word2b"), result[1], words);

    history2.unshift(result[0] + " ＆ " + result[1]);

    set(history2Ref, history2);
}

function displayHistory2(){

    const ul = document.getElementById("history2");

    ul.innerHTML = "";

    history2.forEach(item=>{

        const li = document.createElement("li");

        li.textContent = item;

        ul.appendChild(li);
    });
}

window.clearHistory2 = function(){

    history2 = [];

    set(history2Ref, []);
}

</script>

</body>
</html>
