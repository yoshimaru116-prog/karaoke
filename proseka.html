/* =========================
   状態
========================= */

let currentWord = "";

let previousWord = "";

let excludedWords = new Set();

/* =========================
   Firebase リアルタイム同期
========================= */

const excludedRef = ref(db, "excludedWords");

/* 他の人が変更したら自動反映 */
/* 他の人が変更したら自動反映 */
onValue(excludedRef, (snapshot) => {

    const data = snapshot.val();

    if(data){

        excludedWords = new Set(data);

    }else{

        excludedWords = new Set();

    }

    /* 初期表示 */
    generateRandomWord();

});

/* Firebase保存 */
function saveExcludedWords(){

    set(
        excludedRef,
        [...excludedWords]
    );
}

/* =========================
   ランダム取得
========================= */

function getRandomWord(){

    const availableWords =
        words.filter(
            word => !excludedWords.has(word)
        );

    if(availableWords.length === 0){

        return "曲がありません";

    }

    const randomIndex =
        Math.floor(
            Math.random() * availableWords.length
        );

    return availableWords[randomIndex];
}

/* =========================
   曲表示
========================= */

window.generateRandomWord = function(){

    previousWord = currentWord;

    currentWord = getRandomWord();

    document.getElementById("word").textContent =
        currentWord;
}

/* =========================
   除外
========================= */

window.excludeWord = function(){

    if(currentWord === "") return;

    if(currentWord === "曲がありません") return;

    excludedWords.add(currentWord);

    saveExcludedWords();

    generateRandomWord();
}

/* =========================
   戻る
========================= */

window.goBack = function(){

    if(previousWord !== ""){

        excludedWords.delete(previousWord);

        saveExcludedWords();

        currentWord = previousWord;

        document.getElementById("word").textContent =
            currentWord;

    }else{

        alert("一つ前の単語がありません。");

    }
}

/* =========================
   リセット
========================= */

window.resetExcludedWords = function(){

    const result =
        confirm("保存データをリセットしますか？");

    if(result){

        excludedWords.clear();

        saveExcludedWords();

        alert("リセットしました");

        generateRandomWord();
    }
}
